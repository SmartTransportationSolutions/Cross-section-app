  <rect x="12" y="20" width="7" height="18" rx="1" fill="#2e8bb8"/>
  <rect x="14" y="23" width="3" height="3" fill="#143a66"/>
  <rect x="14" y="29" width="3" height="3" fill="#143a66"/>
