name: CI

on: [push, pull_request]

env:
  HUSKY: "0"
  CYPRESS_INSTALL_BINARY: "0"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The upstream codebase does not typecheck cleanly (108 pre-existing
      # errors at the imported commit), so this is reported but not gating.
      - run: npm run typecheck
        continue-on-error: true

  test:
    name: Unit and integration tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: streetmix
          POSTGRES_PASSWORD: streetmix
          POSTGRES_DB: sts_street_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: streetmix
      PGPASSWORD: streetmix
      PGDATABASE: sts_street_test
      COOKIE_SESSION_SECRET: ci-only-secret
      # Run the database-backed identity tests (app/auth/__tests__/*.db.test.ts)
      PG_INTEGRATION: "true"
      MAIL_TRANSPORT: outbox
      MAIL_OUTBOX_DIR: ./data/test-mail-outbox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Migrate test database
        run: npx sequelize-cli db:migrate
      - name: Build packages
        run: npm run build:app
      - name: Unit and integration tests
        run: npm run vitest:ci

  e2e:
    name: Browser acceptance tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: streetmix
          POSTGRES_PASSWORD: streetmix
          POSTGRES_DB: sts_street_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: streetmix
      PGPASSWORD: streetmix
      PGDATABASE: sts_street_e2e
      COOKIE_SESSION_SECRET: ci-only-secret
      MAIL_TRANSPORT: outbox
      PORT: 8000
      E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Use the project's Playwright version (npx may resolve another one)
      - run: node node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}
      - run: npx sequelize-cli db:migrate
      - name: Seed demo accounts used by the journeys
        run: npm run db:seed:demo
      - run: npm run build:app
      - name: Start server
        run: |
          node index.ts > server.log 2>&1 &
          node bin/wait-for-server.mjs http://localhost:8000/healthz 120000
      - name: Run acceptance journeys
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence-${{ matrix.browser }}
          path: |
            test/e2e/output
            server.log

  pages-e2e:
    name: GitHub Pages edition (static build + browser journeys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Build the static edition
        run: npm run build:pages
        env:
          APP_BASE_PATH: /Cross-section-app
          SKIP_DOCS: "true"
          SKIP_SOURCE_ARCHIVE: "true"
      - name: Serve like GitHub Pages
        run: |
          node bin/serve-pages.mjs 8080 > pages-server.log 2>&1 &
          node bin/wait-for-server.mjs http://localhost:8080/Cross-section-app/ 60000
      - name: Run Pages journeys
        run: npm run test:e2e:pages
        env:
          PAGES_BASE_URL: http://localhost:8080/Cross-section-app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-e2e-evidence
          path: |
            test/e2e/output
            pages-server.log

  build:
    name: Production build and source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:app
      - run: npm run source:archive
      - name: Docker image
        run: docker build -t sts-street:ci .
