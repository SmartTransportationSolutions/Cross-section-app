name: CI

on: [push, pull_request]

env:
  HUSKY: "0"
  CYPRESS_INSTALL_BINARY: "0"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The upstream codebase does not typecheck cleanly (108 pre-existing
      # errors at the imported commit), so this is reported but not gating.
      - run: npm run typecheck
        continue-on-error: true

  test:
    name: Unit and integration tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: streetmix
          POSTGRES_PASSWORD: streetmix
          POSTGRES_DB: sts_street_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: streetmix
      PGPASSWORD: streetmix
      PGDATABASE: sts_street_test
      COOKIE_SESSION_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Migrate test database
        run: npx sequelize-cli db:migrate
      - name: Build packages
        run: npm run build:app
      - name: Unit and integration tests
        run: npm run vitest:ci

  e2e:
    name: Browser acceptance tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: streetmix
          POSTGRES_PASSWORD: streetmix
          POSTGRES_DB: sts_street_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: streetmix
      PGPASSWORD: streetmix
      PGDATABASE: sts_street_e2e
      COOKIE_SESSION_SECRET: ci-only-secret
      MAIL_TRANSPORT: outbox
      PORT: 8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx sequelize-cli db:migrate
      - run: npm run build:app
      - name: Start server
        run: |
          node index.ts > server.log 2>&1 &
          node bin/wait-for-server.mjs http://localhost:8000/healthz 120000
      - name: Run acceptance journeys
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: |
            test/e2e/output
            server.log

  build:
    name: Production build and source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:app
      - run: npm run source:archive
      - name: Docker image
        run: docker build -t sts-street:ci .
