# STS Street: one-command local or single-host deployment.
#
#   cp .env.example .env   # then set COOKIE_SESSION_SECRET and (for production)
#                          # APP_DOMAIN, SMTP_*, AUTH_JWT_PRIVATE_KEY_FILE
#   docker compose up --build
#
# The app listens on http://localhost:8000. Put a TLS-terminating reverse
# proxy (Caddy, nginx, a cloud load balancer) in front of it for production
# and set APP_PROTOCOL=https, APP_DOMAIN=<host>, TRUST_PROXY=true.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-streetmix}
      POSTGRES_PASSWORD: ${PGPASSWORD:-streetmix}
      POSTGRES_DB: ${PGDATABASE:-sts_street}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-streetmix} -d ${PGDATABASE:-sts_street}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    image: sts-street:latest
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-streetmix}
      PGPASSWORD: ${PGPASSWORD:-streetmix}
      PGDATABASE: ${PGDATABASE:-sts_street}
      TRUST_PROXY: "true"
      AUTH_JWT_PRIVATE_KEY_FILE: /app/data/auth-key.pem
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - app-data:/app/data

volumes:
  db-data:
  app-data:
